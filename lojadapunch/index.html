<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1628">
<meta name="description" content="Loja da Punch — streetwear oficial do PunchGame, o fantasy game de batalha de rima. Camisetas e moletons oversized. Drop 001 no ar.">
<title>Loja da Punch — Streetwear Oficial PunchGame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1628;
    --navy-2:#101E33;
    --navy-3:#16263F;
    --cyan:#00FFFF;
    --gold:#FFD700;
    --white:#FFFFFF;
    --muted:#8FA1BC;
    --line:rgba(255,255,255,.08);
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    background:var(--navy);
    color:var(--white);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.55;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .display{font-family:'Anton',Impact,sans-serif;font-weight:400;letter-spacing:.02em;text-transform:uppercase}

  /* ---------- marquee ---------- */
  .marquee{background:var(--gold);color:var(--navy);overflow:hidden;white-space:nowrap;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .marquee-inner{display:inline-block;padding:7px 0;animation:mq 22s linear infinite}
  @keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;
    background:rgba(10,22,40,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .logo{height:44px;width:auto}
  .cart-btn{position:relative;padding:8px;display:flex;align-items:center}
  .cart-btn svg{width:24px;height:24px;stroke:var(--white)}
  .badge{
    position:absolute;top:0;right:0;min-width:18px;height:18px;border-radius:9px;
    background:var(--cyan);color:var(--navy);font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
    transform:scale(0);transition:transform .2s cubic-bezier(.68,-0.55,.27,1.55);
  }
  .badge.on{transform:scale(1)}

  /* ---------- hero ---------- */
  .hero{
    position:relative;text-align:center;padding:56px 20px 48px;overflow:hidden;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(0,255,255,.13), transparent 60%),
      radial-gradient(ellipse 60% 40% at 85% 100%, rgba(255,215,0,.07), transparent 60%),
      var(--navy);
  }
  .hero .eyebrow{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;margin-bottom:14px}
  .hero h1{font-size:clamp(46px,13vw,96px);line-height:.95;color:var(--white)}
  .hero h1 em{font-style:normal;color:var(--cyan)}
  .hero p{color:var(--muted);max-width:420px;margin:16px auto 26px;font-size:15px}
  .cta{
    display:inline-block;background:var(--cyan);color:var(--navy);
    font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;
    padding:16px 38px;border-radius:999px;text-decoration:none;
    box-shadow:0 0 32px rgba(0,255,255,.35);
    transition:transform .15s;
  }
  .cta:active{transform:scale(.96)}

  /* ---------- filters ---------- */
  .shop-head{padding:34px 16px 4px;display:flex;align-items:baseline;justify-content:space-between}
  .shop-head h2{font-size:30px}
  .shop-head span{color:var(--gold);font-size:12px;font-weight:600;letter-spacing:.1em}
  .pills{display:flex;gap:8px;padding:14px 16px;overflow-x:auto;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{
    flex:0 0 auto;padding:9px 20px;border-radius:999px;font-size:13px;font-weight:600;
    color:var(--muted);background:var(--navy-2);border:1px solid var(--line);
    transition:all .15s;
  }
  .pill.on{background:var(--white);color:var(--navy);border-color:var(--white)}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:6px 16px 40px}
  @media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:16px;max-width:1080px;margin:0 auto}}
  @media(min-width:1080px){.grid{grid-template-columns:repeat(4,1fr)}}
  .card{border-radius:var(--radius);overflow:hidden;background:var(--navy-2);border:1px solid var(--line);text-align:left;cursor:pointer}
  .card .ph{position:relative;height:0;padding-top:125%;overflow:hidden;background:#f2f2f2}
  .card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cnav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:2;
    width:24px;height:24px;border-radius:50%;
    background:rgba(10,22,40,.35);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;border:none;padding:0;
  }
  .cnav svg{width:11px;height:11px;stroke:#fff;stroke-width:2.5}
  .cnav.prev{left:6px}
  .cnav.next{right:6px}
  .cnav:active{background:rgba(10,22,40,.7)}
  .cdots{position:absolute;bottom:8px;left:0;right:0;z-index:2;display:flex;justify-content:center;gap:4px;pointer-events:none}
  .cdots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:all .15s}
  .cdots i.on{background:var(--cyan);width:11px;border-radius:3px}
  .card .tag{
    position:absolute;bottom:8px;left:8px;z-index:1;background:var(--navy);color:var(--gold);
    font-size:10px;font-weight:700;letter-spacing:.08em;padding:4px 8px;border-radius:6px;text-transform:uppercase;
  }
  .card .tag-drop{
    position:absolute;top:8px;right:8px;z-index:1;
    background:var(--gold);color:var(--navy);
    font-size:10px;font-weight:800;letter-spacing:.08em;padding:4px 9px;border-radius:6px;text-transform:uppercase;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .card .info{padding:10px 12px 12px}
  .card .name{font-size:13px;font-weight:600;line-height:1.3;min-height:34px}
  .card .price{color:var(--white);font-weight:700;font-size:15px;margin-top:4px}
  .card .inst{color:var(--muted);font-size:11px}
  .dots{display:flex;gap:7px;margin-top:8px}
  .dot{width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);padding:0;cursor:pointer}
  .dot.sel{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,255,255,.3)}

  /* ---------- product view ---------- */
  .pv{position:fixed;inset:0;z-index:60;background:var(--navy);overflow-y:auto;overscroll-behavior:contain;transform:translateX(100%);transition:transform .28s cubic-bezier(.32,.72,.35,1);visibility:hidden}
  .pv.open{transform:translateX(0);visibility:visible}
  .pv-top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:linear-gradient(rgba(10,22,40,.85),transparent);pointer-events:none}
  .pv-top button{pointer-events:auto;position:relative;width:42px;height:42px;border-radius:50%;background:rgba(10,22,40,.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
  .pv-top svg{width:20px;height:20px;stroke:var(--white)}
  .gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:-62px}
  .gallery::-webkit-scrollbar{display:none}
  .gallery img{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/5;object-fit:cover;background:#f2f2f2}
  @media(min-width:720px){.pv-body{max-width:520px;margin:0 auto}.gallery img{aspect-ratio:1/1}}
  .gdots{display:flex;justify-content:center;gap:6px;padding:12px 0 4px}
  .gdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .2s}
  .gdots i.on{background:var(--cyan);width:18px;border-radius:3px}
  .pv-info{padding:10px 20px 130px}
  .pv-info .cat{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
  .pv-info h1{font-size:30px;line-height:1.05;margin:6px 0 10px}
  .pv-price{display:flex;align-items:baseline;gap:10px}
  .pv-price b{font-size:24px;white-space:nowrap}
  .pv-price span{color:var(--muted);font-size:13px}
  .opt-label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
  .opt-label b{color:var(--white)}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .swatch{
    padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;
    background:var(--navy-2);border:1.5px solid var(--line);color:var(--muted);transition:all .15s;
  }
  .swatch.on{border-color:var(--cyan);color:var(--white);background:var(--navy-3)}
  .sizes{display:flex;gap:8px}
  .size{
    width:52px;height:48px;border-radius:10px;font-size:14px;font-weight:600;
    background:var(--navy-2);border:1.5px solid var(--line);color:var(--white);transition:all .15s;
  }
  .size.on{background:var(--cyan);color:var(--navy);border-color:var(--cyan)}
  .pv-desc{color:var(--muted);font-size:14.5px;margin-top:22px}
  .acc{border-top:1px solid var(--line);margin-top:22px}
  .acc details{border-bottom:1px solid var(--line)}
  .acc summary{padding:15px 0;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .acc summary::after{content:'+';color:var(--cyan);font-size:18px}
  .acc details[open] summary::after{content:'–'}
  .acc p{color:var(--muted);font-size:13.5px;padding:0 0 15px}
  .pv-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:65;
    display:flex;align-items:center;gap:14px;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:rgba(10,22,40,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    transform:translateY(110%);transition:transform .28s;
  }
  .pv.open ~ .pv-bar{transform:translateY(0)}
  .pv-bar .p{flex-shrink:0}
  .pv-bar .p b{font-size:18px}
  .pv-bar .p span{display:block;color:var(--muted);font-size:11px}
  .addcart{
    flex:1;background:var(--cyan);color:var(--navy);font-weight:700;font-size:14px;
    letter-spacing:.05em;text-transform:uppercase;padding:16px;border-radius:12px;
    transition:transform .15s;
  }
  .addcart:active{transform:scale(.97)}

  /* ---------- cart drawer ---------- */
  .scrim{position:fixed;inset:0;z-index:70;background:rgba(4,10,20,.6);opacity:0;visibility:hidden;transition:opacity .25s}
  .scrim.open{opacity:1;visibility:visible}
  .cart{
    position:fixed;left:0;right:0;bottom:0;z-index:71;max-height:88vh;display:flex;flex-direction:column;
    background:var(--navy-2);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
    transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.72,.35,1);
  }
  @media(min-width:720px){.cart{left:auto;width:420px;top:0;max-height:none;border-radius:20px 0 0 20px;transform:translateX(105%)}}
  .cart.open{transform:translate(0,0)}
  .cart-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
  .cart-h h3{font-size:20px}
  .cart-h button{color:var(--muted);font-size:14px;font-weight:600}
  .cart-items{flex:1;overflow-y:auto;padding:6px 20px}
  .ci{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .ci img{width:64px;height:80px;object-fit:cover;border-radius:8px}
  .ci .n{font-size:13px;font-weight:600;line-height:1.3}
  .ci .v{color:var(--muted);font-size:12px;margin-top:2px}
  .ci .r{margin-left:auto;text-align:right;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}
  .ci .r b{font-size:14px}
  .trash{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--navy-3)}
  .trash svg{width:15px;height:15px;stroke:var(--muted)}
  .trash:active svg{stroke:#ff5c5c}
  .qty{display:flex;align-items:center;gap:10px;margin-top:8px}
  .qty button{width:26px;height:26px;border-radius:7px;background:var(--navy-3);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .qty span{font-size:13px;font-weight:600;min-width:14px;text-align:center}
  .cart-empty{text-align:center;color:var(--muted);padding:56px 20px}
  .cart-empty .display{color:var(--white);font-size:22px;margin-bottom:6px}
  .cart-f{padding:16px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .cep-row{display:flex;gap:8px;margin-bottom:10px}
  .cep-row input{flex:1;min-width:0;background:var(--navy-3);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--white);font-size:14px;font-family:inherit;outline:none}
  .cep-row input::placeholder{color:var(--muted)}
  .cep-row input:focus{border-color:var(--cyan)}
  .cep-row button{background:var(--navy-3);border:1px solid var(--line);border-radius:10px;padding:0 18px;font-weight:700;font-size:13px;color:var(--white)}
  .fopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:13px;background:var(--navy-2);color:var(--white)}
  .fopt.on{border-color:var(--cyan);background:var(--navy-3)}
  .fopt small{color:var(--muted)}
  .fopt b{margin-left:auto}
  .festim{color:var(--muted);font-size:11px;text-align:center;margin:0 0 10px}
  .row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px}
  .row.total{color:var(--white);font-weight:700;font-size:17px;margin:4px 0 6px}
  .pix{color:var(--gold);font-size:12.5px;text-align:center;margin-bottom:12px}
  .checkout{
    width:100%;background:var(--cyan);color:var(--navy);font-weight:700;font-size:14px;
    letter-spacing:.05em;text-transform:uppercase;padding:17px;border-radius:12px;
  }
  .checkout:active{transform:scale(.98)}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:96px;z-index:80;transform:translate(-50%,20px);
    background:var(--white);color:var(--navy);font-size:13.5px;font-weight:600;
    padding:12px 22px;border-radius:999px;opacity:0;transition:all .25s;pointer-events:none;
    white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.4);
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);padding:40px 20px calc(28px + env(safe-area-inset-bottom));text-align:center}
  footer img{height:72px;margin:0 auto 14px}
  footer p{color:var(--muted);font-size:12.5px}
  footer .links{display:flex;justify-content:center;gap:20px;margin:16px 0}
  footer .links a{color:var(--white);font-size:13px;font-weight:600;text-decoration:none}
</style>
</head>
<body>

<div class="marquee"><div class="marquee-inner" id="marquee"></div></div>

<header>
  <img class="logo" src="img/logo-dark.png" alt="Punch Game">
  <button class="cart-btn" onclick="openCart()" aria-label="Abrir sacola">
    <svg fill="none" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007Z"/></svg>
    <span class="badge" id="badge">0</span>
  </button>
</header>

<section class="hero">
  <div class="eyebrow">PunchGame® apresenta</div>
  <h1 class="display">Loja da<br><em>Punch</em></h1>
  <p>O streetwear oficial do fantasy game de batalha de rima. Peças oversized pra quem vive o game dentro e fora da roda.</p>
  <a class="cta" href="#drop">Ver o drop 001</a>
</section>

<div class="shop-head" id="drop">
  <h2 class="display">Drop 001</h2>
  <span id="count"></span>
</div>
<div class="pills" id="pills"></div>
<div class="grid" id="grid"></div>

<footer>
  <img src="img/logo-dark.png" alt="Punch Game">
  <div class="links"><a href="#drop">Drop 001</a><a href="#" onclick="openCart();return false">Sacola</a></div>
  <p>lojadapunch.com — streetwear oficial PunchGame®<br>Feito no Brasil pra quem rima o mundo.</p>
</footer>

<!-- product view -->
<div class="pv" id="pv">
  <div class="pv-top">
    <button onclick="closePV()" aria-label="Voltar"><svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg></button>
    <button onclick="openCart()" aria-label="Sacola"><svg fill="none" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007Z"/></svg><span class="badge" id="badge2">0</span></button>
  </div>
  <div class="pv-body" id="pvBody"></div>
</div>
<div class="pv-bar" id="pvBar"></div>

<!-- cart -->
<div class="scrim" id="scrim" onclick="closeCart()"></div>
<div class="cart" id="cart">
  <div class="cart-h"><h3 class="display">Sacola</h3><button onclick="closeCart()">Fechar</button></div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-f" id="cartFoot"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===================== CONFIG =====================
// Coloque aqui o WhatsApp da loja com DDI+DDD, só números. Ex: "5511999998888"
const WHATSAPP = "";
const SIZES = ["P","M","G","GG"];

 {id:"worldwide", name:"Camiseta Punch® Worldwide", cat:"camiseta", price:89,
  desc:"PUNCH em letra gótica com degradê ciano-amarelo sobre o globo, cercado de estrelas — porque o game começou na roda, mas a mira é o mundo. Pra quem representa a cultura onde quer que pise.",
  variants:[{name:"Preta", hex:"#111", imgs:["img/p05-1.jpg","img/p05-2.jpg","img/p05-3.jpg"]}]},
 {id:"cao-de-guarda", name:"Camiseta Punch® Cão de Guarda", cat:"camiseta", price:89,
  desc:"Frente com o logo Punch em caligrafia metal vermelho-sangue. Nas costas, o cão de guarda do game: rottweiler de corrente e pingente P, cercado de espinhos, encarando de frente. Não é pra passar despercebido — é pra impor respeito.",
  variants:[{name:"Preta", hex:"#111", imgs:["img/p06-1.jpg","img/p06-2.jpg","img/p06-3.jpg"]}]},
 {id:"anjo-da-guarda", name:"Camiseta Punch® Anjo da Guarda", cat:"camiseta", price:89,
  desc:"Um anjo em gravura clássica repousando sobre o P gótico da Punch — o sagrado e a rua na mesma estampa, como toda rima que nasce do caos e vira arte. Print frontal grande e assinatura Punch Game na manga.",
  variants:[{name:"Preta", hex:"#111", imgs:["img/p07-1.jpg","img/p07-2.jpg","img/p07-3.jpg"]}]},
 {id:"corrente", name:"Camiseta Punch® Corrente", cat:"camiseta", price:89,
  desc:"P gótico cromado cercado por uma corrente de elos brilhando — o brasão de quem fechou com o game. Monograma discreto no peito e estampa grande nas costas com o selo Worldwide Punch Authentic. Cromo e vinho, combinação de respeito.",
  variants:[{name:"Bordô", hex:"#4a1420", imgs:["img/p08-1.jpg","img/p08-2.jpg","img/p08-3.jpg"]}]},
 {id:"mic-eterno", name:"Camiseta Punch® Mic Eterno", cat:"camiseta", price:89,
  desc:"Mão de caveira agarrada no microfone entre chamas azuis — porque tem gente que solta o mic, e tem gente que leva ele pro além. Estampa frontal grande com o script Punch em vermelho. Rima até o último osso.",
  variants:[{name:"Preta", hex:"#111", imgs:["img/p09-1.jpg","img/p09-2.jpg","img/p09-3.jpg"]}]},
 {id:"pixo", name:"Camiseta Punch® Pixo", cat:"camiseta", price:89,
  desc:"O corte mais ousado do drop: tag vertical em handstyle na barra da camiseta, fora do centro, como pixo em muro que não pediu licença. O resto da peça fica limpo — quem sabe, sabe. Minimalismo de rua.",
  variants:[{name:"Preta", hex:"#111", imgs:["img/p10-1.jpg","img/p10-2.jpg","img/p10-3.jpg"]}]},
 {id:"moletom-coroa", name:"Moletom Punch® Coroa", cat:"moletom", price:189,
  desc:"O clássico instantâneo da Punch: script autoral com coroa e círculo de estrelas no peito, e o nome da marca descendo pelas duas mangas em caligrafia. Moletom pesado com capuz e bolso canguru. Três jeitos de coroar o fit.",
  variants:[
    {name:"Blackout", hex:"#20242a", imgs:["img/p11-1.jpg","img/p11-2.jpg","img/p11-3.jpg"]},
    {name:"Verde-água", hex:"#2ec4c4", imgs:["img/p12-1.jpg","img/p12-2.jpg","img/p12-3.jpg"]},
    {name:"Dourado", hex:"#e8b830", imgs:["img/p13-1.jpg","img/p13-2.jpg","img/p13-3.jpg"]}]},
 {id:"moletom-estrela", name:"Moletom Punch® Estrela", cat:"moletom", price:189,
  desc:"Logo oval em metal líquido no peito e estrelas descendo pelas mangas: a Punch na sua fase Y2K. Moletom preto pesado, capuz e bolso canguru, com print que parece cromado de tão vivo. Vermelho pra atacar, ciano pra brilhar, cromo pra quem joga no modo espelho.",
  variants:[
    {name:"Vermelho", hex:"#c22b2b", imgs:["img/p14-1.jpg","img/p14-2.jpg","img/p14-3.jpg"]},
    {name:"Ciano", hex:"#00d5e8", imgs:["img/p15-1.jpg","img/p15-2.jpg","img/p15-3.jpg"]},
    {name:"Cromo", hex:"#cfd6de", imgs:["img/p16-1.jpg","img/p16-2.jpg","img/p16-3.jpg"]}]},
];

// ===================== STATE =====================
let cart = [];
try{ cart = JSON.parse(localStorage.getItem("punch_cart")||"[]") }catch(e){ cart = [] }
let filter = "todos";
let cur = null, curVar = 0, curSize = null;

const $ = id => document.getElementById(id);
const brl = v => "R$ " + v.toFixed(2).replace(".",",").replace(/,00$/,"");
const inst = v => "3x de " + brl(v/3) + " sem juros";
const save = () => { try{ localStorage.setItem("punch_cart", JSON.stringify(cart)) }catch(e){} };

// ===================== MARQUEE =====================
const MSG = "DROP 001 NO AR&nbsp;&nbsp;🥊&nbsp;&nbsp;FRETE PARA TODO O BRASIL&nbsp;&nbsp;🥊&nbsp;&nbsp;ATÉ 3X SEM JUROS&nbsp;&nbsp;🥊&nbsp;&nbsp;";
$("marquee").innerHTML = MSG.repeat(6);

// ===================== GRID =====================
function renderPills(){
  const cats = [["todos","Todos"],["camiseta","Camisetas"],["moletom","Moletons"]];
  $("pills").innerHTML = cats.map(([v,l]) =>
    `<button class="pill ${filter===v?'on':''}" onclick="setFilter('${v}')">${l}</button>`).join("");
}
function setFilter(v){ filter=v; renderPills(); renderGrid(); }
const cardIdx = {}; // foto atual de cada card na home
const allImgs = p => p.variants.flatMap(v=>v.imgs);
function renderGrid(){
  const list = P.filter(p => filter==="todos" || p.cat===filter);
  $("count").textContent = list.length + (list.length===1?" peça":" peças");
  $("grid").innerHTML = list.map(p => {
    const imgs = allImgs(p), i = cardIdx[p.id]||0;
    return `
    <div class="card" onclick="openFromCard('${p.id}')">
      <div class="ph">
        ${p.variants.length>1?`<span class="tag">${p.variants.length} cores</span>`:""}
        <span class="tag-drop">Drop limitado</span>
        <img id="cimg-${p.id}" src="${imgs[i]}" alt="${p.name}" loading="lazy">
        <button class="cnav prev" onclick="cardNav(event,'${p.id}',-1)" aria-label="Foto anterior"><svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg></button>
        <button class="cnav next" onclick="cardNav(event,'${p.id}',1)" aria-label="Próxima foto"><svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg></button>
        <div class="cdots" id="cdots-${p.id}">${imgs.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join("")}</div>
      </div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="price">${brl(p.price)}</div>
        <div class="inst">${inst(p.price)}</div>
        ${p.variants.length>1?`<div class="dots" id="vdots-${p.id}">${p.variants.map((v,vi)=>`<button class="dot ${vi===varOfIdx(p,i)?'sel':''}" style="background:${v.hex}" onclick="pickColor(event,'${p.id}',${vi})" aria-label="Cor ${v.name}"></button>`).join("")}</div>`:""}
      </div>
    </div>`}).join("");
}
function varOfIdx(p, i){
  // qual variante corresponde à foto de índice i no carrossel do card
  let vi = 0;
  for(let k=0;k<p.variants.length;k++){
    if(i < p.variants[k].imgs.length) return k;
    i -= p.variants[k].imgs.length;
  }
  return vi;
}
function syncCard(id, i){
  const p = P.find(x=>x.id===id);
  cardIdx[id] = i;
  $("cimg-"+id).src = allImgs(p)[i];
  [...$("cdots-"+id).children].forEach((el,j)=>el.classList.toggle("on", j===i));
  const vd = $("vdots-"+id);
  if(vd){ const vi = varOfIdx(p, i); [...vd.children].forEach((el,j)=>el.classList.toggle("sel", j===vi)); }
}
function cardNav(e, id, d){
  e.stopPropagation();
  const p = P.find(x=>x.id===id), imgs = allImgs(p);
  syncCard(id, ((cardIdx[id]||0) + d + imgs.length) % imgs.length);
}
function pickColor(e, id, vi){
  e.stopPropagation();
  const p = P.find(x=>x.id===id);
  let off = 0;
  for(let k=0;k<vi;k++) off += p.variants[k].imgs.length;
  syncCard(id, off);
}
function openFromCard(id){
  // abre o produto já na cor da foto que está aparecendo no card
  const p = P.find(x=>x.id===id);
  let i = cardIdx[id]||0, vi = 0;
  for(let k=0;k<p.variants.length;k++){
    if(i < p.variants[k].imgs.length){ vi = k; break; }
    i -= p.variants[k].imgs.length;
  }
  openPV(id, vi);
}

// ===================== PRODUCT VIEW =====================
function openPV(id, varIdx){
  cur = P.find(p=>p.id===id); curVar = varIdx||0; curSize = null;
  renderPV(); $("pv").classList.add("open");
  $("pv").scrollTop = 0;
  history.pushState({pv:id},"","#"+id);
}
function closePV(){
  $("pv").classList.remove("open");
  if(location.hash) history.pushState({},"",location.pathname);
}
window.addEventListener("popstate", e => {
  if(!location.hash){ $("pv").classList.remove("open"); }
});
function renderPV(){
  const p = cur, v = p.variants[curVar];
  $("pvBody").innerHTML = `
    <div class="gallery" id="gal" onscroll="galDots()">
      ${v.imgs.map(src=>`<img src="${src}" alt="${p.name} — ${v.name}">`).join("")}
    </div>
    <div class="gdots" id="gdots">${v.imgs.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join("")}</div>
    <div class="pv-info">
      <div class="cat">${p.cat==="camiseta"?"Camiseta oversized":"Moletom com capuz"}</div>
      <h1 class="display">${p.name.replace("Camiseta Punch® ","").replace("Moletom Punch® ","")}</h1>
      <div class="pv-price"><b>${brl(p.price)}</b><span>${inst(p.price)} · <em style="color:var(--gold);font-style:normal">5% off no Pix</em></span></div>
      ${p.variants.length>1?`
        <div class="opt-label">Cor: <b>${v.name}</b></div>
        <div class="swatches">${p.variants.map((vv,i)=>`<button class="swatch ${i===curVar?'on':''}" onclick="setVar(${i})">${vv.name}</button>`).join("")}</div>`:""}
      <div class="opt-label">Tamanho ${curSize?`: <b>${curSize}</b>`:""}</div>
      <div class="sizes">${SIZES.map(s=>`<button class="size ${curSize===s?'on':''}" onclick="setSize('${s}')">${s}</button>`).join("")}</div>
      <p class="pv-desc">${p.desc}</p>
      <div class="acc">
        <details><summary>Modelagem e cuidados</summary><p>Modelagem oversized — se preferir o caimento tradicional, peça um tamanho abaixo. Lavar do avesso, não usar alvejante, não secar em máquina.</p></details>
        <details><summary>Envio</summary><p>Enviamos para todo o Brasil. Cada pedido passa por uma preparação cuidadosa de até 4 dias úteis antes da postagem — depois disso conta o prazo do frete escolhido. O prazo total estimado aparece na sacola, já com tudo incluído.</p></details>
        <details><summary>Troca e devolução</summary><p>Primeira troca grátis em até 7 dias após o recebimento, com a peça sem uso e com etiqueta.</p></details>
      </div>
    </div>`;
  $("pvBar").innerHTML = `
    <div class="p"><b>${brl(p.price)}</b><span>${inst(p.price)}</span></div>
    <button class="addcart" onclick="addToCart()">Adicionar à sacola</button>`;
}
function galDots(){
  const g = $("gal"), i = Math.round(g.scrollLeft / g.clientWidth);
  [...$("gdots").children].forEach((d,j)=>d.classList.toggle("on", j===i));
}
function setVar(i){ curVar = i; renderPV(); }
function setSize(s){ curSize = s; renderPV(); }

// ===================== CART =====================
function addToCart(){
  if(!curSize){ toast("Escolhe o tamanho primeiro 👆"); return; }
  const p = cur, v = p.variants[curVar];
  const key = p.id+"|"+v.name+"|"+curSize;
  const found = cart.find(i=>i.key===key);
  if(found) found.qty++;
  else cart.push({key, id:p.id, name:p.name, variant:v.name, size:curSize, price:p.price, img:v.imgs[0], qty:1});
  save(); updateBadge();
  toast("Na sacola! 🥊");
}
function updateBadge(){
  const n = cart.reduce((s,i)=>s+i.qty,0);
  ["badge","badge2"].forEach(id=>{
    const b = $(id); if(!b) return;
    b.textContent = n;
    b.classList.toggle("on", n>0);
  });
}
function openCart(){ renderCart(); $("scrim").classList.add("open"); $("cart").classList.add("open"); }
function closeCart(){ $("scrim").classList.remove("open"); $("cart").classList.remove("open"); }
function removeItem(key){
  cart = cart.filter(i=>i.key!==key);
  save(); updateBadge(); renderCart();
}
function chQty(key,d){
  const it = cart.find(i=>i.key===key); if(!it) return;
  it.qty += d;
  if(it.qty<=0) cart = cart.filter(i=>i.key!==key);
  save(); updateBadge(); renderCart();
}
function renderCart(){
  if(cart.length===0){
    $("cartItems").innerHTML = `<div class="cart-empty"><div class="display">Sacola vazia</div>Bora resolver isso? O drop tá te esperando.</div>`;
    $("cartFoot").innerHTML = `<button class="checkout" onclick="closeCart()">Ver o drop</button>`;
    return;
  }
  $("cartItems").innerHTML = cart.map(i=>`
    <div class="ci">
      <img src="${i.img}" alt="">
      <div>
        <div class="n">${i.name}</div>
        <div class="v">${i.variant} · Tam. ${i.size}</div>
        <div class="qty">
          <button onclick="chQty('${i.key}',-1)">−</button><span>${i.qty}</span><button onclick="chQty('${i.key}',1)">+</button>
        </div>
      </div>
      <div class="r">
        <b>${brl(i.price*i.qty)}</b>
        <button class="trash" onclick="removeItem('${i.key}')" aria-label="Remover da sacola">
          <svg fill="none" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>
        </button>
      </div>
    </div>`).join("");
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const fr = (freteOpts && freteSel!=null) ? freteOpts[freteSel] : null;
  const totalF = total + (fr ? fr.price : 0);
  $("cartFoot").innerHTML = `
    <div class="cep-row">
      <input id="cepIn" inputmode="numeric" placeholder="Digite seu CEP" maxlength="9" value="${freteCep}">
      <button onclick="calcFrete()">Calcular frete</button>
    </div>
    ${freteOpts ? freteOpts.map((o,i)=>`
      <button class="fopt ${freteSel===i?'on':''}" onclick="pickFrete(${i})">
        <span>${o.name} <small>· chega em até ${o.days} dias úteis</small></span><b>${brl(o.price)}</b>
      </button>`).join("") + `<div class="festim">prazo já inclui o preparo do seu pedido · valores estimados, confirmados na finalização</div>` : ""}
    <div class="row"><span>Subtotal</span><span>${brl(total)}</span></div>
    <div class="row"><span>Frete</span><span>${fr ? fr.name+" — "+brl(fr.price) : "calcule acima"}</span></div>
    <div class="row total"><span>Total</span><span>${brl(totalF)}</span></div>
    <div class="pix">⚡ ${brl(totalF*0.95)} no Pix (5% off)</div>
    <button class="checkout" onclick="checkout()">Fechar pedido no WhatsApp</button>`;
}
let freteOpts = null, freteSel = null, freteCep = "";
function calcFrete(){
  const v = ($("cepIn").value||"").replace(/\D/g,"");
  if(v.length!==8){ toast("Digita um CEP válido (8 números)"); return; }
  freteCep = v.slice(0,5)+"-"+v.slice(5);
  // Origem: região Av. Eng. Luís Carlos Berrini, São Paulo/SP (CEP 04571).
  // "dist" = anel de distância a partir de SP por região do CEP (1º dígito):
  // 0/1 = SP · 2 = RJ/ES · 3 = MG · 8 = PR/SC · 9 = RS · 7 = Centro-Oeste · 4/5/6 = NE/N
  const DIST = {0:0, 1:1, 2:2, 3:2, 8:2, 9:3, 7:3, 4:4, 5:5, 6:6};
  const d = DIST[+v[0]];
  const PREP = 4; // dias úteis de preparo do pedido (picking + packing), somados ao prazo do frete
  freteOpts = [
    {name:"PAC",   price:+(17.9 + d*3.4).toFixed(2), days:PREP + Math.max(2, 3 + Math.round(d*1.5))},
    {name:"SEDEX", price:+(25.9 + d*4.8).toFixed(2), days:PREP + Math.max(1, 1 + Math.round(d*0.8))}
  ];
  freteSel = 0;
  renderCart();
}
function pickFrete(i){ freteSel = i; renderCart(); }
function checkout(){
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const fr = (freteOpts && freteSel!=null) ? freteOpts[freteSel] : null;
  const totalF = total + (fr ? fr.price : 0);
  let msg = "🥊 *PEDIDO — LOJA DA PUNCH*\n\n";
  cart.forEach(i=>{ msg += `${i.qty}x ${i.name} (${i.variant}, ${i.size}) — ${brl(i.price*i.qty)}\n`; });
  if(fr) msg += `Frete ${fr.name} (CEP ${freteCep}) — ${brl(fr.price)}\n`;
  msg += `\n*Total: ${brl(totalF)}* (${brl(totalF*0.95)} no Pix)\n\nNome:\nEndereço + CEP:`;
  const url = WHATSAPP
    ? `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`
    : `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
  window.open(url,"_blank");
}

// ===================== TOAST =====================
let toastT;
function toast(m){
  const t = $("toast"); t.textContent = m; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("on"), 2200);
}

// ===================== INIT =====================
renderPills(); renderGrid(); updateBadge();
if(location.hash){ const id = location.hash.slice(1); if(P.find(p=>p.id===id)) openPV(id); }
</script>
